name: panfu

x-app: &app
  image: panfu-app:${TAG:-latest}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - internal
  logging: &logging
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
    expose:
      - "80"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      gameserver-main:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1/up >/dev/null
          && wget -qO- http://127.0.0.1/engine/main/actuator/health >/dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
      - nginx-proxy
    logging: *logging

  app:
    <<: *app
    networks:
      internal:
        aliases:
          - panfu-app-internal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    stop_grace_period: 2m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: >-
      sh -lc 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  gameserver-main:
    image: panfu-game-server:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_SERVER_ID: 1
      HTTP_PORT: 9596
      LEGACY_TCP_PORT: 9595
      LEGACY_TCP_ENABLED: "true"
      INTERNAL_API_SECRET: ${PANFU_GAME_SERVER_INTERNAL_SECRET}
      ALLOWED_ORIGINS: ${APP_URL}
    expose:
      - "9595"
      - "9596"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9596'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      internal:
        aliases:
          - panfu-engine-main-internal
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - internal
    logging: *logging

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "0.0.0.0:${PHPMYADMIN_PUBLIC_PORT:-58473}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

networks:
  internal:
  nginx-proxy:
    external: true
    name: nginx-proxy

volumes:
  app_storage:
  mysql_data:
  redis_data:
