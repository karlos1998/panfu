services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${APP_PORT:-80}:80'
            - '${FORWARD_HOST:-127.0.0.1}:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            gameserver:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
            selenium:
                condition: service_started
    gameserver:
        build:
            context: './game-server'
            dockerfile: Dockerfile
        environment:
            DB_URL: 'jdbc:mysql://mysql:3306/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
            GAME_SERVER_ID: 1
            HTTP_PORT: 9596
            LEGACY_TCP_PORT: 9595
            LEGACY_TCP_ENABLED: 'true'
            INTERNAL_API_SECRET: '${PANFU_GAME_SERVER_INTERNAL_SECRET:-local-development-secret-change-me}'
            ALLOWED_ORIGINS: '${APP_URL:-http://localhost},http://localhost:${APP_PORT:-80},http://127.0.0.1,http://127.0.0.1:${APP_PORT:-80}'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_GAME_SERVER_WEBSOCKET_PORT:-19596}:9596'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', "bash -c '</dev/tcp/127.0.0.1/9596'"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 5s
        restart: unless-stopped
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    phpmyadmin:
        image: 'phpmyadmin:5.2'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_PHPMYADMIN_PORT:-19999}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            UPLOAD_LIMIT: 256M
        networks:
            - sail
        depends_on:
            - mysql
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_MAILPIT_PORT:-11025}:1025'
            - '${FORWARD_HOST:-127.0.0.1}:${FORWARD_MAILPIT_DASHBOARD_PORT:-18025}:8025'
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
